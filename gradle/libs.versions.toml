[versions]
discord4j = "3.3.3"
coroutines-reactor = "1.10.2"
reactor-extensions = "1.2.4"

[libraries]
discord4j-core = { module = "com.discord4j:discord4j-core", version.ref = "discord4j" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "coroutines-reactor" }
reactor-kotlin-extensions = { module = "io.projectreactor.kotlin:reactor-kotlin-extensions", version.ref = "reactor-extensions" }